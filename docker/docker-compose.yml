services:
  webscraper-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Inside the compose network the database is reachable via its service name
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-webscraper}
      - DB_USER=${DB_USER:-webscraper}
      - DB_PASSWORD=${DB_PASSWORD:?Please set DB_PASSWORD (e.g. in docker/.env)}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - PERSIST_METRICS=${PERSIST_METRICS:-true}
      - METRICS_DB_PATH=/app/data/metrics.db
      - CONFIG_DIR=/app/config
      # Optional hardening (see README "Security")
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      # Bind mounts with short syntax: Docker creates ../data and ../config
      # automatically if they do not exist (fixes "failed to mount local volume ... no such file or directory").
      - ../data:/app/data
      - ../config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-webscraper}
      - POSTGRES_USER=${DB_USER:-webscraper}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Please set DB_PASSWORD (e.g. in docker/.env)}
    volumes:
      # Persistent volume for PostgreSQL data
      - postgres_data:/var/lib/postgresql/data
      # Schema + migrations, executed in order on first start
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ../migrations/add_last_used_column.sql:/docker-entrypoint-initdb.d/02-add-last-used.sql:ro
    # Only exposed on localhost - the API reaches it via the compose network
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: webscraper_network
